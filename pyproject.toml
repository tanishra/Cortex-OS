[project]
name = "cortex-os"
version = "0.1.0"
description = "Production-grade browser agent service powered by browser-use"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "browser-use==0.13.11",
    "openai>=2.14.0",
    "python-dotenv>=1.2.0",
    "arq>=0.26.0",
    "redis>=5.2.0,<6",
    "sqlmodel>=0.0.27",
    "cryptography>=46.0.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
